name: collect
on:
  schedule:
    - cron: "0 21,3,8 * * *"   # KST 06:00 · 12:00 · 17:00
  push:
    branches: [main]
    paths: ["data/kw.enc.json"]   # 로컬 PC가 키워드를 갱신하면 즉시 수집
  workflow_dispatch:
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: collect & commit
        env:
          TREND_PW: ${{ secrets.TREND_PW }}
        run: |
          git config user.name "kiapi-trend-bot"
          git config user.email "actions@users.noreply.github.com"
          # 항상 최신 main 위에서 수집한다 — 앞선 실행이 먼저 올린 결과를 덮지 않도록,
          # 푸시가 밀리면 최신으로 맞춘 뒤 다시 수집해서 올린다
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python collect.py
            git add data
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -q -m "수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
