name: collect
on:
  schedule:
    - cron: "0 21,3,8 * * *"   # KST 06:00 · 12:00 · 17:00
  push:
    branches: [main]
    paths: ["data/kw.enc.json"]   # 로컬 PC가 키워드를 갱신하면 즉시 수집
  workflow_dispatch:
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - run: python collect.py
        env:
          TREND_PW: ${{ secrets.TREND_PW }}
      - name: commit
        run: |
          git config user.name "kiapi-trend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
